<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management MVP</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #032147, #209dd7);
        color: white;
        font-family: Arial, sans-serif;
      }
      .card {
        padding: 3rem 4rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 4rem);
      }
      p {
        margin-top: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World</h1>
      <p>Project Management MVP</p>
    </div>
  </body>
</html>
